<?xml version="1.0" encoding="UTF-8"?>
<!-- Bookmark Manager's icon: Matt's pick, mockup icon 2 "Tabbed folder" — a folder with three color-coded index
     tabs on a teal tile. Drawn on the 1024 canvas macOS uses; the tile is the 824-pt rounded square Big Sur icons
     sit in. make_icns.sh turns it into BookmarkManager.icns. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15857c"/>
      <stop offset="1" stop-color="#0c6b63"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g transform="translate(100,100) scale(6.8667) translate(-4,-4)">
    <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#tile)"/>
    <rect x="4.5" y="4.5" width="119" height="119" rx="26.6" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>
    <g filter="url(#shadow)">
      <rect x="46" y="30" width="18" height="16" rx="4" fill="#ef4444"/>
      <rect x="68" y="30" width="18" height="16" rx="4" fill="#f59e0b"/>
      <rect x="90" y="30" width="18" height="16" rx="4" fill="#22c55e"/>
      <path d="M20 44 a6 6 0 0 1 6 -6 h20 l8 8 h48 a6 6 0 0 1 6 6 v40 a6 6 0 0 1 -6 6 h-76 a6 6 0 0 1 -6 -6 z" fill="#99f6e4"/>
      <rect x="20" y="58" width="88" height="42" rx="6" fill="#ecfeff"/>
      <path d="M34 72 h30 M34 82 h44" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
